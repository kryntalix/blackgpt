<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
:root{
  --bg:#eef1f6; --panel:#fbfcfe; --ink:#1b2433; --mute:#667085; --line:#d9dfe9;
  --accent:#3f51d6; --accent-ink:#fff; --user:#e0e5f7; --code:#e6eaf2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --panel:#181c26; --ink:#e6e9f0; --mute:#8d96a8; --line:#2a3040;
    --accent:#8c9bff; --accent-ink:#12151d; --user:#262d47; --code:#222838; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#181c26; --ink:#e6e9f0; --mute:#8d96a8; --line:#2a3040;
  --accent:#8c9bff; --accent-ink:#12151d; --user:#262d47; --code:#222838; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;font-weight:600;margin:0;flex:1}
button,select,textarea{font:inherit;color:inherit}
.btn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#settings{display:none;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
#settings.open{display:block}
#settings label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
#settings textarea,#settings select{width:100%;max-width:720px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
#settings textarea{min-height:88px;resize:vertical}
#settings .row{margin-bottom:12px}
#log{flex:1;overflow-y:auto;padding:24px 16px 8px}
.wrap{max-width:720px;margin:0 auto}
.msg{margin:0 0 22px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{background:var(--user);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.bot .body{font-family:var(--serif);font-size:17.5px;line-height:1.65;word-break:break-word}
.msg.bot .body p{margin:0 0 .8em}
.msg.bot .body pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:13.5px;line-height:1.5;margin:0 0 .9em}
.msg.bot .body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--code);padding:1px 5px;border-radius:4px}
.msg.bot .body pre code{background:none;padding:0}
.empty{color:var(--mute);text-align:center;margin-top:18vh;font-family:var(--serif);font-size:19px}
.dots::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:p 1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
form{padding:10px 16px 14px;background:var(--bg)}
.box{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.box:focus-within{border-color:var(--accent)}
#inp{flex:1;border:0;background:none;resize:none;max-height:180px;padding:6px 8px;font-size:16px;line-height:1.4;outline:none}
#send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Chat</h1>
  <button class="btn" id="theme" type="button">Mavzu</button>
  <button class="btn" id="clear" type="button">Tozalash</button>
  <button class="btn" id="gear" type="button" aria-expanded="false">Sozlamalar</button>
</header>
<section id="settings">
  <div class="row">
    <label for="sys">System prompt (AI qanday javob berishini belgilaydi)</label>
    <textarea id="sys" placeholder="Masalan: Sen do'stona o'zbek tilidagi yordamchisan. Qisqa va aniq javob ber."></textarea>
  </div>
  <div class="row">
    <label for="model">Model</label>
    <select id="model"></select>
  </div>
</section>
<main id="log"><div class="wrap" id="msgs"></div></main>
<form id="form">
  <div class="box">
    <textarea id="inp" rows="1" placeholder="Xabar yozing..." aria-label="Xabar"></textarea>
    <button id="send" type="submit">Yuborish</button>
  </div>
</form>
<script>
const $=id=>document.getElementById(id);
const msgsEl=$("msgs"),log=$("log"),inp=$("inp"),send=$("send"),sys=$("sys"),modelSel=$("model");
let history=[],ctrl=null;

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(t){
  const parts=t.split("```");
  return parts.map((p,i)=>{
    if(i%2===1){return "<pre><code>"+esc(p.replace(/^[\w+-]*\n/,""))+"</code></pre>"}
    return esc(p).split(/\n{2,}/).filter(x=>x.trim()).map(x=>{
      x=x.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
      return "<p>"+x+"</p>";
    }).join("");
  }).join("");
}
function empty(){msgsEl.innerHTML='<div class="empty">Savol yozing, boshlaymiz.</div>'}
function add(role,text){
  if(msgsEl.querySelector(".empty"))msgsEl.innerHTML="";
  const m=document.createElement("div");m.className="msg "+role;
  const b=document.createElement("div");b.className="body";
  if(role==="user")b.textContent=text;else b.innerHTML=text?render(text):'<span class="dots"></span>';
  m.appendChild(b);msgsEl.appendChild(m);log.scrollTop=log.scrollHeight;return b;
}
async function load(){
  sys.value=store.get("sys","");
  try{
    const ms=await (await fetch("/models")).json();
    modelSel.innerHTML=ms.map(m=>`<option>${m}</option>`).join("");
    modelSel.value=store.get("model",ms[0]);if(!modelSel.value)modelSel.value=ms[0];
  }catch(e){}
  empty();
}
sys.addEventListener("input",()=>store.set("sys",sys.value));
modelSel.addEventListener("change",()=>store.set("model",modelSel.value));
$("gear").onclick=()=>{const o=$("settings").classList.toggle("open");$("gear").setAttribute("aria-expanded",o)};
$("clear").onclick=()=>{if(ctrl)ctrl.abort();history=[];empty()};
$("theme").onclick=()=>{
  const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme);
};
if(store.get("theme",""))document.documentElement.dataset.theme=store.get("theme","");

inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,180)+"px"});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("form").requestSubmit()}});

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(ctrl){ctrl.abort();return}
  const text=inp.value.trim();if(!text)return;
  inp.value="";inp.style.height="auto";
  history.push({role:"user",content:text});add("user",text);
  const out=add("bot","");let acc="";
  ctrl=new AbortController();send.textContent="To'xtatish";
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctrl.signal,
      body:JSON.stringify({messages:history,system:sys.value,model:modelSel.value})});
    if(!r.ok)throw new Error("Server xatosi: "+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {done,value}=await rd.read();if(done)break;
      acc+=dec.decode(value,{stream:true});out.innerHTML=render(acc);log.scrollTop=log.scrollHeight}
  }catch(err){
    if(err.name!=="AbortError"){acc+=(acc?"\n\n":"")+"Xato: "+err.message;out.innerHTML=render(acc)}
  }
  if(!acc)out.innerHTML=render("(javob kelmadi)");
  history.push({role:"assistant",content:acc});
  ctrl=null;send.textContent="Yuborish";inp.focus();
});
load();
</script>
</body>
</html>
